name: Daily Macro Report

on:
  schedule:
    # 한국 시간 기준 오전 7:00 (UTC 22:00)
    # 미국 시장 마감 직후 데이터를 가져오기에 가장 적합한 시간입니다.
    - cron: '0 22 * * *' 
  workflow_dispatch:      # 필요할 때 수동으로 바로 실행할 수 있는 버튼 추가

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # 1. yfinance: 최신 데이터 API 대응을 위해 항상 업데이트
          # 2. python-telegram-bot: main.py의 async/await 문법을 위해 v20 이상 최신판 설치
          # 3. pytz: 한국 시간(KST) 계산을 위해 필요
          pip install --upgrade yfinance python-telegram-bot pytz requests

      - name: Run script
        run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
